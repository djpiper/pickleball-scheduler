name: Preview deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One preview per PR. A new push supersedes an in-flight deploy of the same PR,
# and closing the PR supersedes both — the cleanup job shares this group so it
# cannot race a deploy it was meant to tear down.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    # Secrets are not exposed to fork PRs, so the deploy would fail anyway.
    # Skip cleanly rather than failing the check.
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The branch name ends up inside a command line, and git permits
      # characters a shell would act on. Check it here rather than trusting it.
      - name: Check the branch name
        id: branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$BRANCH" in
            *[!A-Za-z0-9._/-]*)
              echo "Refusing to deploy: branch name has characters this workflow will not pass to a shell: $BRANCH" >&2
              exit 1
              ;;
          esac
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # --branch is anything other than the project's production branch (main),
      # so Cloudflare treats this as a preview: it gets its own URL and picks up
      # the [env.preview] bindings from wrangler.toml (the pickleball-preview D1).
      #
      # Cloudflare derives the URL from this name: lowercased, anything not
      # alphanumeric turned into a dash, cut to 28 characters.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=pickleball-scheduler
            --branch=${{ steps.branch.outputs.name }}

      # One comment per PR, edited in place on later pushes, so a long-running
      # PR does not accumulate a comment per commit.
      - name: Comment the preview URL
        uses: actions/github-script@v9
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          COMMIT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const body = [
              marker,
              '### Preview deployment',
              '',
              `**${process.env.ALIAS_URL}** — always the latest commit on this PR.`,
              '',
              `This build only: ${process.env.COMMIT_URL}`,
              '',
              `Commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. `,
              'Runs against the `pickleball-preview` D1 database, not real poll data.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  cleanup:
    name: Delete preview
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      # No checkout or npm ci — this only needs the wrangler CLI, not the app.
      # A PR accumulates one deployment per push, and the list command pages,
      # so delete in rounds until a round finds nothing left for this branch.
      #
      # Deployments record the branch name as given, not as it appears in the
      # URL, so this matches $BRANCH exactly rather than the dashed alias.
      - name: Delete this PR's preview deployments
        run: |
          for round in $(seq 1 20); do
            ids=$(npx --yes wrangler@4 pages deployment list \
              --project-name=pickleball-scheduler \
              --environment=preview --json \
              | jq -r --arg b "$BRANCH" '.[] | select(.Branch == $b) | .Id')

            if [ -z "$ids" ]; then
              echo "Round $round: nothing left for $BRANCH"
              break
            fi

            for id in $ids; do
              # --force because the newest deployment still holds the branch alias.
              npx --yes wrangler@4 pages deployment delete "$id" \
                --project-name=pickleball-scheduler --force
            done
          done

      # Leave the comment in place but strike the dead URL, so nobody clicks a
      # preview that no longer exists.
      - name: Mark the preview as removed
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );
            if (!existing) return;

            const body = [
              marker,
              '### Preview deployment',
              '',
              'Removed — this PR is closed.',
            ].join('\n');
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            });
